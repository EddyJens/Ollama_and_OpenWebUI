global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "open-webui"
    static_configs:
      - targets: ["open-webui:8080"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]